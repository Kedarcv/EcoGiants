<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Body (rounded leaf shape) -->
  <ellipse cx="100" cy="120" rx="50" ry="60" fill="#2ECC71" stroke="#27AE60" stroke-width="3"/>
  
  <!-- Face background -->
  <circle cx="100" cy="100" r="40" fill="#FFFFFF"/>
  
  <!-- Eyes (enthusiastic, teaching) -->
  <ellipse cx="85" cy="95" rx="13" ry="15" fill="#2C3E50"/>
  <ellipse cx="115" cy="95" rx="13" ry="15" fill="#2C3E50"/>
  
  <!-- Eye highlights -->
  <circle cx="88" cy="90" r="5" fill="#FFFFFF"/>
  <circle cx="118" cy="90" r="5" fill="#FFFFFF"/>
  
  <!-- Open mouth (speaking) -->
  <ellipse cx="100" cy="118" rx="12" ry="8" fill="#2C3E50"/>
  <path d="M 88 118 Q 100 126 112 118" fill="#E74C3C"/>
  
  <!-- Teaching gesture - right arm pointing up -->
  <path d="M 145 105 Q 165 85 170 70" stroke="#2ECC71" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="170" cy="70" r="10" fill="#2ECC71"/>
  
  <!-- Left arm holding pointer/book -->
  <path d="M 55 110 Q 35 100 30 90" stroke="#2ECC71" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="30" cy="90" r="10" fill="#2ECC71"/>
  
  <!-- Lightbulb idea icon above head -->
  <ellipse cx="100" cy="50" rx="15" ry="20" fill="#F39C12" opacity="0.8"/>
  <path d="M 95 65 L 95 75" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  <path d="M 105 65 L 105 75" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 65 L 100 78" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Leaf accent on head -->
  <path d="M 100 50 Q 120 30 130 40 Q 110 55 100 50" fill="#27AE60"/>
</svg>
