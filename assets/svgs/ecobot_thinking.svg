<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Thinking Pose: Hand on chin, looking up, thought bubble -->
  
  <!-- Body -->
  <path d="M60 140 C60 140 50 170 50 180 C50 190 60 190 70 185 L80 180" stroke="#2ECC71" stroke-width="12" stroke-linecap="round"/>
  <path d="M140 140 C140 140 150 170 150 180 C150 190 140 190 130 185 L120 180" stroke="#2ECC71" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="100" cy="130" rx="50" ry="60" fill="#2ECC71"/>
  
  <!-- Arm on Chin -->
  <path d="M140 130 Q160 120 160 100 Q160 80 140 90" stroke="#2ECC71" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="140" cy="90" r="12" fill="#2ECC71"/>
  
  <!-- Other Arm Down -->
  <path d="M60 130 Q40 140 40 160" stroke="#2ECC71" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="40" cy="160" r="12" fill="#2ECC71"/>
  
  <!-- Eyes Looking Up -->
  <ellipse cx="85" cy="115" rx="8" ry="10" fill="white"/>
  <ellipse cx="115" cy="115" rx="8" ry="10" fill="white"/>
  <circle cx="87" cy="112" r="4" fill="#2C3E50"/>
  <circle cx="117" cy="112" r="4" fill="#2C3E50"/>
  <circle cx="89" cy="110" r="2" fill="white"/>
  <circle cx="119" cy="110" r="2" fill="white"/>
  
  <!-- Mouth (Small 'o') -->
  <circle cx="100" cy="145" r="5" fill="#2C3E50"/>
  
  <!-- Thought Bubble -->
  <path d="M150 60 Q160 50 170 60 Q180 70 170 80 Q160 90 150 80 Q140 70 150 60" fill="white" stroke="#2ECC71" stroke-width="3"/>
  <circle cx="140" cy="50" r="4" fill="white"/>
  <circle cx="130" cy="40" r="3" fill="white"/>
  
  <!-- Question Mark in Bubble -->
  <path d="M155 65 Q165 65 165 70 Q165 75 155 75" stroke="#2ECC71" stroke-width="3" fill="none"/>
  <circle cx="160" cy="80" r="2" fill="#2ECC71"/>
</svg>
