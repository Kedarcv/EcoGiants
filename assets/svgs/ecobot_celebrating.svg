<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Body (rounded leaf shape) -->
  <ellipse cx="100" cy="120" rx="50" ry="60" fill="#2ECC71" stroke="#27AE60" stroke-width="3"/>
  
  <!-- Face background -->
  <circle cx="100" cy="100" r="40" fill="#FFFFFF"/>
  
  <!-- Eyes (excited, happy - closed in joy) -->
  <path d="M 75 95 Q 85 85 95 95" stroke="#2C3E50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 105 95 Q 115 85 125 95" stroke="#2C3E50" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Big smile -->
  <path d="M 80 110 Q 100 135 120 110" stroke="#2C3E50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 85 112 Q 100 128 115 112" fill="#E74C3C"/>
  
  <!-- Both arms raised in celebration -->
  <path d="M 145 105 Q 170 80 175 60" stroke="#2ECC71" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="175" cy="60" r="10" fill="#2ECC71"/>
  
  <path d="M 55 105 Q 30 80 25 60" stroke="#2ECC71" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="25" cy="60" r="10" fill="#2ECC71"/>
  
  <!-- Confetti stars around -->
  <polygon points="160,40 165,50 175,50 167,58 170,68 160,62 150,68 153,58 145,50 155,50" fill="#F39C12"/>
  <polygon points="40,50 44,58 52,58 46,64 48,72 40,68 32,72 34,64 28,58 36,58" fill="#3498DB"/>
  <polygon points="170,140 174,148 182,148 176,154 178,162 170,158 162,162 164,154 158,148 166,148" fill="#E74C3C"/>
  <polygon points="30,150 34,158 42,158 36,164 38,172 30,168 22,172 24,164 18,158 26,158" fill="#2ECC71"/>
  
  <!-- Leaf accent on head (waving) -->
  <path d="M 100 50 Q 125 25 135 35 Q 110 50 100 50" fill="#27AE60"/>
</svg>
