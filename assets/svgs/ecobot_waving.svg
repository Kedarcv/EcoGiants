<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Body (rounded leaf shape) -->
  <ellipse cx="100" cy="120" rx="50" ry="60" fill="#2ECC71" stroke="#27AE60" stroke-width="3"/>
  
  <!-- Face background -->
  <circle cx="100" cy="100" r="40" fill="#FFFFFF"/>
  
  <!-- Eyes (Duolingo style - large, expressive) -->
  <ellipse cx="85" cy="95" rx="12" ry="15" fill="#2C3E50"/>
  <ellipse cx="115" cy="95" rx="12" ry="15" fill="#2C3E50"/>
  
  <!-- Eye highlights -->
  <circle cx="88" cy="90" r="5" fill="#FFFFFF"/>
  <circle cx="118" cy="90" r="5" fill="#FFFFFF"/>
  
  <!-- Smile -->
  <path d="M 85 110 Q 100 125 115 110" stroke="#2C3E50" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Waving arm (right side) -->
  <path d="M 145 110 Q 170 100 175 80" stroke="#2ECC71" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="175" cy="80" r="10" fill="#2ECC71"/>
  
  <!-- Static arm (left side) -->
  <path d="M 55 115 Q 40 130 35 140" stroke="#2ECC71" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="35" cy="140" r="10" fill="#2ECC71"/>
  
  <!-- Leaf accent on head -->
  <path d="M 100 50 Q 120 30 130 40 Q 110 55 100 50" fill="#27AE60"/>
</svg>
